name: baca_meter
description: "A new Flutter project."
publish_to: "none" # Remove this line if you wish to publish to pub.dev

version: 1.0.0+1

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter

  flutter_localizations:
    sdk: flutter

  # State management
  equatable: ^2.0.7
  provider: ^6.1.5

  # Network
  dio: ^5.8.0+1
  mutex: ^3.1.0

  # Dependency Injection
  get_it: ^8.0.3

  #UI
  cupertino_icons: ^1.0.8
  remixicon: ^1.4.1
  google_fonts: ^6.2.1

  # Utility
  package_info_plus: ^8.3.0
  flutter_dotenv: ^5.2.1
  go_router: ^16.2.0
  flutter_screenutil: ^5.9.3
  intl: ^0.20.2
  connectivity_plus: ^6.1.4
  path: ^1.9.0
  path_provider: ^2.1.3
  flutter_image_compress: ^2.2.1
  archive: ^3.6.1
  device_info_plus: ^9.1.0
  percent_indicator: ^4.2.5
  cupertino_will_pop_scope: ^1.2.1
  dartz: ^0.10.1

  # Permission
  permission_handler: ^11.3.1

  # Image
  image_picker: ^1.2.0
  camera: ^0.11.3

  # Machine Learning
  mobile_scanner: ^7.1.3

  # Local
  drift: ^2.20.0
  sqlite3_flutter_libs: ^0.5.22
  shared_preferences: ^2.5.3

  # UI
  toastification: ^3.0.2
  dashed_border: ^1.0.2
  showcaseview: ^4.0.1

  # Security
  encrypt: ^5.0.3

  # Location
  geolocator: ^14.0.0

  crypto: any
dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^5.0.0

  drift_dev: ^2.20.0
  build_runner: ^2.10.0

  # Launcher
  flutter_launcher_icons: ^0.14.3

flutter_launcher_icons:
  android: true
  ios: true
  remove_alpha_ios: true
  image_path: "assets/launchers/ic_pdam_baca_meter_launcher_rounded.png"
  # image_path: "assets/launchers/ic_launcher.png"
  image_path_ios: "assets/launchers/ic_pdam_baca_meter_launcher_normal.png"
  image_path_ios_dark_transparent: "assets/launchers/ic_pdam_baca_meter_launcher_ios_dark.png"
  image_path_ios_tinted_grayscale: "assets/launchers/ic_pdam_baca_meter_launcher_ios_tint.png"
  web:
    generate: false
  windows:
    generate: false
  macos:
    generate: false

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter packages.
flutter:
  # The following line ensures that the Material Icons font is
  # included with your application, so that you can use the icons in
  # the material Icons class.
  uses-material-design: true

  # To add assets to your application, add an assets section, like this:
  assets:
    - assets/images/
    - assets/icon/
    - assets/icon/login/
    - assets/icon/home/
    - assets/launchers/
    - .env


  # An image asset can refer to one or more resolution-specific "variants", see
  # https://flutter.dev/to/resolution-aware-images

  # For details regarding adding assets from package dependencies, see
  # https://flutter.dev/to/asset-from-package

  # To add custom fonts to your application, add a fonts section here,
  # in this "flutter" section. Each entry in this list should have a
  # "family" key with the font family name, and a "fonts" key with a
  # list giving the asset and other descriptors for the font. For
  # example:
  # fonts:
  #   - family: Schyler
  #     fonts:
  #       - asset: fonts/Schyler-Regular.ttf
  #       - asset: fonts/Schyler-Italic.ttf
  #         style: italic
  #   - family: Trajan Pro
  #     fonts:
  #       - asset: fonts/TrajanPro.ttf
  #       - asset: fonts/TrajanPro_Bold.ttf
  #         weight: 700
  #
  # For details regarding fonts from package dependencies,
  # see https://flutter.dev/to/font-from-package
